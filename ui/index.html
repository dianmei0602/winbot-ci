<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>winbot · 我自己的机器人</title>
    <link rel="stylesheet" href="/assets/app.css" />
    <link rel="icon" href="/assets/favicon.svg" />
  </head>
  <body>
    <div id="app" class="app">
      <aside class="sidebar" id="sidebar">
        <header class="side-head">
          <div class="brand"><span class="brand-dot"></span>winbot</div>
          <button class="icon-btn" id="btn-new-bot" title="新建机器人">＋</button>
        </header>

        <div class="side-search">
          <input id="bot-search" type="search" placeholder="搜索机器人…" autocomplete="off" />
        </div>

        <div class="side-list" id="bot-list"></div>

        <div class="side-groups">
          <div class="side-groups-head">
            <span>群聊</span>
            <button class="icon-btn tiny" id="btn-new-group" title="建一个群">＋</button>
          </div>
          <div id="group-list" class="group-list"></div>
        </div>

        <footer class="side-foot">
          <button class="side-nav" id="btn-schedules"><span class="nav-icon"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span>自动化</button>
          <button class="side-nav" id="btn-plugins"><span class="nav-icon"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v5M15 3v5"/><path d="M6 8h12v3a6 6 0 0 1-12 0Z"/><path d="M12 17v4"/></svg></span>插件与连接</button>
          <button class="side-nav" id="btn-settings"><span class="nav-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1"/></svg></span>设置</button>
          <div class="side-meta" id="side-meta"></div>
        </footer>
      </aside>

      <div class="drawer-scrim" id="drawer-scrim" hidden></div>
      <div class="pane-scrim" id="pane-scrim"></div>

      <main class="main" id="main">
        <div class="empty" id="empty-state">
          <h1>挑一个机器人开始</h1>
          <p>每个机器人有自己的性格、模型、文件夹和记忆。<br />越出它的工作区读写，会先问你。</p>
          <button class="primary" id="btn-first-bot">建第一个机器人</button>
          <p class="hint">数据、记忆和 API Key 都只在这台电脑上。</p>
        </div>

        <section class="chat" id="chat" hidden>
          <header class="chat-head">
            <button class="icon-btn" id="btn-sidebar" title="机器人列表"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
            <div class="chat-title">
              <div class="avatar" id="chat-avatar"></div>
              <div class="chat-title-text">
                <h2 id="chat-name">—</h2>
                <div class="chat-sub" id="chat-sub"></div>
              </div>
            </div>
            <div class="chat-actions">
              <select class="model-select" id="chat-model" title="切换这个机器人的模型"></select>
              <button class="ghost-btn" id="btn-new-task" title="给它加一个定时任务">＋ 任务</button>
              <span class="usage-pill" id="usage-pill" title="这段对话累计的 token" hidden>—</span>
              <button class="icon-btn" id="btn-search" title="搜索聊天记录（Ctrl+K）"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
              <button class="icon-btn" id="btn-comfy" title="打开 ComfyUI（本机生图/生视频）"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m4 18 5-5 4 4 3-3 4 4"/></svg></button>
              <button class="icon-btn" id="btn-new-conv" title="新对话"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
              <button class="icon-btn" id="btn-bot-panel" title="机器人设置"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1"/></svg></button>
              <button class="icon-btn" id="btn-open-convs" title="历史会话"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
            </div>
          </header>
          <div class="messages" id="messages"></div>
          <div class="attachments" id="attachments" hidden></div>
          <div class="composer">
            <button class="icon-btn attach-btn" id="btn-attach" title="加图片或文件（也可以直接粘贴或拖进来）">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21.4 11.05 12.2 20.25a5.5 5.5 0 0 1-7.78-7.78l8.49-8.49a3.67 3.67 0 0 1 5.19 5.19l-8.49 8.49a1.83 1.83 0 0 1-2.6-2.6l7.78-7.78" />
            </svg>
          </button>
            <textarea id="input" rows="1" placeholder="说点什么…（Enter 发送，Shift+Enter 换行；可粘贴图片、拖文件进来）"></textarea>
            <button class="ghost-btn danger" id="btn-stop" hidden title="停止这一轮">停止</button>
            <button class="primary" id="btn-send">发送</button>
          </div>
          <div class="composer-hint" id="composer-hint"></div>
        </section>
      </main>

      <aside class="panel" id="panel" hidden>
        <div class="pane-resizer" id="pane-resizer" title="拖动调整宽度，双击复位"></div>
        <header class="panel-head">
          <h2 id="panel-title">设置</h2>
          <button class="icon-btn" id="btn-panel-close" title="关闭">✕</button>
        </header>
        <div class="panel-body" id="panel-body"></div>
      </aside>
    </div>

    <div class="modal-wrap" id="modal" hidden>
      <div class="modal" id="modal-card"></div>
    </div>
    <div class="toasts" id="toasts"></div>

    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
